
apiVersion: apps/v1
kind: Deployment

metadata:
  name: digital-banking-portal

spec:
  replicas: 2

  selector:
    matchLabels:
      app: digital-banking-portal

  template:
    metadata:
      labels:
        app: digital-banking-portal

    spec:
      containers:
        - name: banking-app
          image: gayatri2002/digital-banking-portal:latest

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "700m"
              memory: "768Mi"

          securityContext:
            allowPrivilegeEscalation: false

