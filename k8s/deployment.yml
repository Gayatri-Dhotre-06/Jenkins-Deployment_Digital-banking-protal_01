
apiVersion: apps/v1
kind: Deployment
metadata:
  name: digital-banking-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: digital-banking-portal
  template:
    metadata:
      labels:
        app: digital-banking-portal
    spec:
      containers:
        - name: banking-app
          image: gayatri2002/digital-banking-portal:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          env:
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: banking-secrets
                  key: JWT_SECRET_KEY

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secrets
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secrets
                  key: DB_PASSWORD

            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/digital_banking_portal"

          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "700m"
              memory: "768Mi"

          securityContext:
            allowPrivilegeEscalation: false
